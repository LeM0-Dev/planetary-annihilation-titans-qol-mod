name: release

# Publishes a GitHub release when main receives code under a NEW version.
# The version is set MANUALLY on staging (modinfo.json + a CHANGELOG.md
# section) before the release PR — tools/promote.sh validates and opens it.
# A push whose version is already released FAILS this workflow on purpose.
#
# Each release carries its versioned ZIP (the historical record) and a
# stable-named ZIP, so the permanent URL
#   .../releases/latest/download/com.lem0.pat-qol.zip
# always serves the newest build.

on:
  push:
    branches: [main]
    # Only shipped code warrants a release — pushes that touch nothing under
    # ui/ (docs, tooling, CI) are skipped.
    paths:
      - 'ui/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version and enforce that it is new
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p 'JSON.parse(require("fs").readFileSync("modinfo.json","utf8")).version')
          echo "version=$V" >> "$GITHUB_OUTPUT"

          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$V is already released. Set a new version on staging" \
                 "(modinfo.json + a CHANGELOG.md section) before the release PR — see tools/promote.sh."
            exit 1
          fi

          if ! grep -q "^## $V " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $V' section — write the release notes first."
            exit 1
          fi

      - name: Install dev tooling
        run: npm ci

      - name: Full check
        run: npm run lint && npm test && node tools/check-modinfo.mjs

      - name: Build package
        run: |
          sh tools/package.sh
          V="${{ steps.v.outputs.version }}"
          cp "dist/com.lem0.pat-qol-$V.zip" "dist/com.lem0.pat-qol.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES=$(awk -v ver="$V" '/^## /{ if (found) exit; if ($2 == ver) { found=1; next } } found' CHANGELOG.md)
          NOTES=$(printf '%s\n\n---\n**Downloads**: `com.lem0.pat-qol-%s.zip` is this release; `com.lem0.pat-qol.zip` is the same file under a stable name so `releases/latest/download/com.lem0.pat-qol.zip` always serves the newest version.' "$NOTES" "$V")
          gh release create "v$V" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PA:T QoL v$V" \
            --notes "$NOTES" \
            --latest \
            "dist/com.lem0.pat-qol-$V.zip" \
            "dist/com.lem0.pat-qol.zip"
