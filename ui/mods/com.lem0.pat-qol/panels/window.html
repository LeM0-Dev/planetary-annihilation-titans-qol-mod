<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- The engine does NOT auto-inject the UI framework; every PA page pulls
         it in explicitly via the boot bundle (jQuery, ko, lodash, api.*). -->
    <link href="bundle://boot/boot.css" rel="stylesheet" type="text/css" />
    <script src="bundle://boot/boot.js" type="text/javascript"></script>
    <link rel="stylesheet" href="coui://ui/mods/com.lem0.pat-qol/panels/window.css">
</head>
<body>
    <div class="paqol-win">
        <div class="paqol-win-title" id="paqol-win-title">
            <span class="paqol-win-title-text" data-bind="text: title"></span>
            <div class="paqol-win-btn" id="paqol-win-minimize"
                 data-bind="text: minimized() ? '+' : '−'"></div>
        </div>

        <div class="paqol-win-body" data-bind="visible: !minimized()">

            <!-- ko if: role === 'paqol_history' -->
            <div class="paqol-list">
                <div class="paqol-empty" data-bind="visible: rows().length === 0">No notifications yet.</div>
                <!-- ko foreach: rows -->
                <div class="paqol-row"
                     data-bind="css: { 'paqol-clickable': !!$data.location },
                                click: function () { $root.jump($data); },
                                event: { contextmenu: function () { return $root.dismiss($data); } }">
                    <!-- ko if: $root.buildIcon($data) -->
                    <img class="paqol-row-icon" onerror="this.style.display='none'" onload="this.style.display=''"
                         data-bind="attr: { src: $root.buildIcon($data) }" />
                    <!-- /ko -->
                    <!-- ko if: $root.siIcon($data) -->
                    <img class="paqol-row-sicon" onerror="this.style.display='none'" onload="this.style.display=''"
                         data-bind="attr: { src: $root.siIcon($data) }, paqolSiTint: $root.rowColor($data)" />
                    <!-- /ko -->
                    <span class="paqol-row-text"
                          data-bind="text: $root.rowText($data), style: { color: $root.rowColor($data) }"></span>
                    <span class="paqol-row-time" data-bind="text: $data.timeText"></span>
                </div>
                <!-- /ko -->
                <div class="paqol-row-more" data-bind="visible: hiddenCount() > 0">
                    <span data-bind="text: '+ ' + hiddenCount() + ' older'"></span>
                </div>
            </div>
            <!-- /ko -->

            <!-- ko if: role === 'paqol_hvt' -->
            <div class="paqol-list">
                <div class="paqol-empty" data-bind="visible: rows().length === 0">No high-value targets spotted.</div>
                <!-- ko foreach: rows -->
                <div class="paqol-row"
                     data-bind="css: { 'paqol-clickable': $data.clickable, 'paqol-stale': $data.stale },
                                click: function () { $root.jump($data); },
                                event: { contextmenu: function () { return $root.dismiss($data); } }">
                    <!-- ko if: $root.buildIcon($data) -->
                    <img class="paqol-row-icon" onerror="this.style.display='none'" onload="this.style.display=''"
                         data-bind="attr: { src: $root.buildIcon($data) }" />
                    <!-- /ko -->
                    <!-- ko if: $root.siIcon($data) -->
                    <img class="paqol-row-sicon" onerror="this.style.display='none'" onload="this.style.display=''"
                         data-bind="attr: { src: $root.siIcon($data) }, paqolSiTint: $root.rowColor($data)" />
                    <!-- /ko -->
                    <span class="paqol-row-text"
                          data-bind="text: $root.rowText($data), style: { color: $root.rowColor($data) }"></span>
                    <span class="paqol-row-time" data-bind="text: $data.seenText"></span>
                </div>
                <!-- /ko -->
            </div>
            <!-- /ko -->

        </div>
        <div class="paqol-win-grip" id="paqol-win-grip" data-bind="visible: !minimized()"></div>
    </div>

    <script type="text/javascript" src="coui://ui/main/shared/js/build.js"></script>
    <script type="text/javascript" src="coui://ui/main/game/live_game/js/constants.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/core/ns.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/core/log.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/core/invariant.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/core/safe.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/shared/schema.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/core/store.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/core/pa_constants.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/shared/timefmt.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/shared/ring.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/shared/hvt_classify.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/features/notify_priority/defaults.js"></script>
    <script type="text/javascript" src="coui://ui/mods/com.lem0.pat-qol/panels/window.js"></script>
</body>
</html>
